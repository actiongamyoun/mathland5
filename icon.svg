<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- 노란 배경 + 검정 테두리 (로블록스 톤) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#ffd23f"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="none" stroke="#1a1a2e" stroke-width="20"/>

  <!-- 별 장식 (좌우) -->
  <g transform="translate(70, 80)" fill="#ff4ba0" stroke="#1a1a2e" stroke-width="6" stroke-linejoin="round">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7"/>
  </g>
  <g transform="translate(442, 80)" fill="#1a7aff" stroke="#1a1a2e" stroke-width="6" stroke-linejoin="round">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7"/>
  </g>

  <!-- 픽셀 캐릭터 (확대 + 중앙 배치)
       원본 16x16 픽셀을 24픽셀로 키우고 320x320 영역에 배치
       시작 좌표: (96, 96), 픽셀 크기: 20 -->
  <g transform="translate(96, 96)">
    <!-- 모자 (분홍) -->
    <rect x="100" y="40"  width="120" height="20" fill="#ff4ba0"/>
    <rect x="80"  y="60"  width="160" height="20" fill="#ff4ba0"/>

    <!-- 얼굴 -->
    <rect x="100" y="80"  width="120" height="60" fill="#ffd9b3"/>
    <!-- 눈 -->
    <rect x="120" y="100" width="20" height="20" fill="#1a1a2e"/>
    <rect x="180" y="100" width="20" height="20" fill="#1a1a2e"/>
    <!-- 볼 / 입 -->
    <rect x="140" y="120" width="40" height="20" fill="#ff4ba0"/>

    <!-- 몸통 (파란 옷) -->
    <rect x="80"  y="140" width="160" height="80" fill="#1a7aff"/>
    <!-- 옷 노란 띠 -->
    <rect x="100" y="160" width="120" height="20" fill="#ffd23f"/>
    <!-- 팔 -->
    <rect x="60"  y="160" width="20" height="60" fill="#1a7aff"/>
    <rect x="240" y="160" width="20" height="60" fill="#1a7aff"/>

    <!-- 다리 (어두운 파랑) -->
    <rect x="100" y="220" width="40" height="60" fill="#0e4ea8"/>
    <rect x="180" y="220" width="40" height="60" fill="#0e4ea8"/>
    <!-- 신발 -->
    <rect x="100" y="280" width="40" height="20" fill="#1a1a2e"/>
    <rect x="180" y="280" width="40" height="20" fill="#1a1a2e"/>
  </g>
</svg>
